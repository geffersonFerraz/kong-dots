services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KONGFLOW_DB_USER:-kongflow}
      POSTGRES_PASSWORD: ${KONGFLOW_DB_PASSWORD:-kongflow}
      POSTGRES_DB: ${KONGFLOW_DB_NAME:-kongflow}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KONGFLOW_DB_USER:-kongflow} -d ${KONGFLOW_DB_NAME:-kongflow}"]
      interval: 5s
      retries: 20
    volumes:
      # Postgres 18 keeps PGDATA under /var/lib/postgresql/18/docker and
      # declares /var/lib/postgresql as its volume — mounting .../data instead
      # would silently lose the database on every restart.
      - kong-flow-db:/var/lib/postgresql

  kong-flow:
    build: .
    image: kong-flow:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Loopback by default on purpose: expose it through the same Cloudflare
      # Tunnel / Zero Trust used by the rest of the infra, never directly.
      # KONGFLOW_BIND=0.0.0.0 opens it to the network — for trying the canvas
      # from another machine, not for anything that needs to stay private.
      - "${KONGFLOW_BIND:-127.0.0.1}:8080:8080"
    environment:
      # Set this to a stable value (e.g. from your secret manager). Without it a
      # key is generated into the data volume on first start.
      KONGFLOW_SECRET_KEY: ${KONGFLOW_SECRET_KEY:-}
      KONGFLOW_CORS_ORIGINS: ${KONGFLOW_CORS_ORIGINS:-}
      # Leave both empty and everyone applies directly. Set them and every other
      # editor's Apply is filed as a change request for one of these people to run.
      KONGFLOW_APPROVERS: ${KONGFLOW_APPROVERS:-}
      KONGFLOW_APPROVER_TOKEN: ${KONGFLOW_APPROVER_TOKEN:-}
      KONGFLOW_DATABASE_URL: postgres://${KONGFLOW_DB_USER:-kongflow}:${KONGFLOW_DB_PASSWORD:-kongflow}@db:5432/${KONGFLOW_DB_NAME:-kongflow}?sslmode=disable
    volumes:
      - kong-flow-data:/data

volumes:
  kong-flow-data:
  kong-flow-db:
