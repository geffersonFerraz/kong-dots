# Self-contained demo stack: Kong 3.9.1 + its Postgres, Kong Flow + its own
# Postgres 18, and a seeded topology whose routes answer with canned JSON
# (request-termination).
#
#   make demo         Kong + demo data + the Kong Flow UI on :8080
#   make demo-kong    Kong + demo data + the Kong Flow database, for `make api`
#                     / `make ui` running on the host
#   make demo-down    tear everything down, including volumes
#
# Every published port is bound to loopback.
name: kong-flow-demo

services:
  kong-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
      POSTGRES_DB: kong
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 3s
      retries: 20

  kong-migrations:
    image: kong:3.9.1
    command: kong migrations bootstrap
    depends_on:
      kong-db:
        condition: service_healthy
    environment: &kong-env
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
    restart: on-failure

  kong:
    image: kong:3.9.1
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
    environment:
      <<: *kong-env
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      retries: 20
    ports:
      - "${KONGFLOW_BIND:-127.0.0.1}:${KONG_PROXY_PORT:-8000}:8000"
      # The Admin API stays on loopback whatever KONGFLOW_BIND says: it has no
      # authentication in this stack, and it is full control of the gateway.
      # Kong Flow reaches it over the compose network, never through this port.
      - "127.0.0.1:${KONG_ADMIN_PORT:-8001}:8001"

  # Creates the demo topology and, when the UI container is running, registers
  # this Kong as a workspace so the canvas is populated on first load.
  demo-seed:
    image: curlimages/curl:8.11.1
    depends_on:
      kong:
        condition: service_healthy
    environment:
      KONG_ADMIN: http://kong:8001
      DOTS_API: http://kong-flow:8080
    volumes:
      - ./seed-demo.sh:/seed-demo.sh:ro
    entrypoint: ["sh", "/seed-demo.sh"]
    restart: on-failure

  # Kong Flow' own store (connections, canvas layout, apply history). Separate
  # from kong-db, which is Kong's. Started in both modes and published on
  # loopback, so `make api` on the host uses the same database as `make demo`.
  kong-flow-db:
    image: postgres:18-alpine
    ports:
      # Loopback only: this is for `make api` on this machine, not for the network.
      - "127.0.0.1:${KONGFLOW_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: kongflow
      POSTGRES_PASSWORD: kongflow
      POSTGRES_DB: kongflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kongflow -d kongflow"]
      interval: 3s
      retries: 20
    volumes:
      # Postgres 18 declares /var/lib/postgresql as its volume, not .../data.
      - kong-flow-db:/var/lib/postgresql

  kong-flow:
    build:
      context: ..
      dockerfile: Dockerfile
    image: kong-flow:latest
    profiles: ["app"]
    depends_on:
      kong:
        condition: service_healthy
      kong-flow-db:
        condition: service_healthy
    environment:
      # Demo-only key. In a real deployment set KONGFLOW_SECRET_KEY from your
      # secret manager — losing it makes stored Admin API credentials unreadable.
      KONGFLOW_SECRET_KEY: demo-only-not-a-real-secret
      KONGFLOW_DATABASE_URL: postgres://kongflow:kongflow@kong-flow-db:5432/kongflow?sslmode=disable
      # The demo runs with no approvers, so Apply goes straight to Kong. Set
      # these two to see the review queue instead: everybody else's Apply is
      # filed as a change request, and only this name — holding this token —
      # can run it.
      # KONGFLOW_APPROVERS: alice
      # KONGFLOW_APPROVER_TOKEN: demo-approval-token
    ports:
      - "${KONGFLOW_BIND:-127.0.0.1}:${KONGFLOW_PORT:-8080}:8080"
    volumes:
      - kong-flow-data:/data

volumes:
  kong-flow-data:
  kong-flow-db:
